name: OMS feature CI
on:
  push:
    paths: ["projects/oms-exception-resolution/**"]
  pull_request:
    paths: ["projects/oms-exception-resolution/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/oms-exception-resolution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/oms-exception-resolution/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
