# The monolith's ONE database. schema.sql runs automatically on first start.
name: day17-monolith

services:
  postgres:
    image: postgres:16-alpine
    container_name: day17-monolith-postgres
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: monolith_db
    ports:
      - "5434:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d monolith_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
