services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-lecture-postgres
    restart: unless-stopped
    # slow query tracking:
    #   pg_stat_statements            -> per-query stats, queryable as a view (SELECT * FROM pg_stat_statements)
    #   log_min_duration_statement    -> log any statement slower than 100ms (docker logs backend-lecture-postgres)
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=100ms
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture_db
    ports:
      - "5434:5432"
    volumes:
      - backend-lecture-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecture_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: backend-lecture-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - backend-lecture-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # #demo-s3 — S3-compatible object storage for local dev, via LocalStack (a
  # real S3 API emulator; MinIO's Docker image now requires a paid login, and
  # LocalStack's own `latest` tag has since moved behind a license too — 3.0
  # is the last fully free Community-edition tag with S3 support). Same SDK
  # calls (S3Client, PutObjectCommand, getSignedUrl) work unchanged against
  # real S3 in production; only the endpoint/credentials env vars change.
  localstack:
    image: localstack/localstack:3.0
    container_name: backend-lecture-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports:
      - "4566:4566" # edge port — all emulated AWS APIs, including S3
    volumes:
      - backend-lecture-localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend-lecture-pgdata:
  backend-lecture-redisdata:
  backend-lecture-localstackdata:
